<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特医食品智能推荐系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1917;
    --ink-60: rgba(26,25,23,0.6);
    --ink-30: rgba(26,25,23,0.3);
    --ink-10: rgba(26,25,23,0.08);
    --cream: #f5f3ef;
    --warm: #e8e4dc;
    --gold: #b5965a;
    --gold-light: rgba(181,150,90,0.12);
    --border: rgba(26,25,23,0.12);
    --radius-sm: 4px;
    --radius: 8px;
    --radius-lg: 16px;
  }

  html { font-size: 17px; scroll-behavior: smooth; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Noto Serif SC', serif;
    font-weight: 400;
    line-height: 1.75;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .site-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--cream);
    border-bottom: 1px solid var(--border);
    padding: 0 48px;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--ink);
    display: flex; align-items: center; gap: 10px;
  }
  .logo-mark {
    width: 28px; height: 28px;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-mark svg { width: 14px; height: 14px; }
  .header-meta {
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-60); font-family: 'DM Mono', monospace; font-weight: 500;
  }

  /* ── MAIN LAYOUT ── */
  .page {
    padding-top: 64px;
    min-height: 100vh;
  }

  .hero {
    padding: 80px 48px 64px;
    border-bottom: 1px solid var(--border);
    max-width: 900px;
  }
  .hero-label {
    font-family: 'DM Mono', monospace;
    font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 20px;
    font-weight: 500;
    display: flex; align-items: center; gap: 8px;
  }
  .hero-label::before {
    content: ''; display: block;
    width: 24px; height: 1px; background: var(--gold);
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(40px, 5vw, 62px);
    font-weight: 600; line-height: 1.12;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 20px;
  }
  .hero-desc {
    font-size: 16px; color: var(--ink-60);
    max-width: 520px; line-height: 1.85;
    font-weight: 400;
  }

  /* ── CONTENT AREA ── */
  .content-wrap {
    display: grid;
    grid-template-columns: 380px 1fr;
    min-height: calc(100vh - 64px);
    align-items: start;
  }

  /* ── FORM PANEL ── */
  .form-panel {
    padding: 48px;
    border-right: 1px solid var(--border);
    position: sticky; top: 64px;
    max-height: calc(100vh - 64px);
    overflow-y: auto;
  }

  .section-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink); font-weight: 500; margin-bottom: 28px;
  }

  .field-group { margin-bottom: 28px; }

  .field-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; letter-spacing: 0.06em;
    color: var(--ink); margin-bottom: 10px;
    font-family: 'DM Mono', monospace; font-weight: 500;
  }
  .field-label svg { width: 14px; height: 14px; color: var(--gold); flex-shrink: 0; }

  .field-select, .field-input {
    width: 100%;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    font-size: 15px; color: var(--ink);
    font-family: 'Noto Serif SC', serif; font-weight: 500;
    appearance: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .field-select:focus, .field-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-light);
  }
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '';
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    width: 8px; height: 5px;
    background: var(--ink-60);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    pointer-events: none;
  }

  /* Tags for conditions */
  .tags-grid {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .tag-btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 100px;
    background: transparent;
    font-size: 13px; color: var(--ink);
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    font-family: 'Noto Serif SC', serif;
    white-space: nowrap;
  }
  .tag-btn:hover { border-color: var(--gold); color: var(--gold); }
  .tag-btn.active {
    background: var(--ink); border-color: var(--ink);
    color: #fff;
  }

  .divider {
    height: 1px; background: var(--border);
    margin: 32px 0;
  }

  /* Quick presets */
  .preset-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-60); font-weight: 500; margin-bottom: 12px;
  }
  .preset-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: transparent; cursor: pointer;
    text-align: left;
    transition: all 0.18s;
    margin-bottom: 8px;
  }
  .preset-btn:hover { background: var(--gold-light); border-color: var(--gold); }
  .preset-icon {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--warm);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .preset-icon svg { width: 14px; height: 14px; }
  .preset-text { font-size: 14px; color: var(--ink); font-weight: 500; }
  .preset-sub { font-size: 12px; color: var(--ink-60); margin-top: 2px; font-weight: 400; }

  .submit-btn {
    width: 100%; margin-top: 8px;
    padding: 17px;
    background: var(--ink);
    border: none; border-radius: var(--radius-sm);
    color: #fff;
    font-size: 14px; letter-spacing: 0.14em;
    font-family: 'DM Mono', monospace; font-weight: 500;
    cursor: pointer;
    transition: all 0.22s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .submit-btn:hover { background: #2e2c29; }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn svg { width: 15px; height: 15px; }

  /* ── RESULTS PANEL ── */
  .results-panel {
    padding: 48px;
  }

  /* Empty state */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 80px 40px; text-align: center;
    color: var(--ink-30);
  }
  .empty-state-icon {
    width: 64px; height: 64px;
    border: 1px dashed var(--ink-30); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  .empty-state-icon svg { width: 28px; height: 28px; }
  .empty-state h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 300; color: var(--ink-60);
    margin-bottom: 8px;
  }
  .empty-state p { font-size: 13px; line-height: 1.7; max-width: 280px; }

  /* Results header */
  .results-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 32px; padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .results-count {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px; font-weight: 600;
    line-height: 1;
  }
  .results-count span {
    font-size: 13px; font-family: 'DM Mono', monospace;
    color: var(--ink-60); font-weight: 500;
    display: block; margin-top: 6px; letter-spacing: 0.06em;
  }
  .results-patient {
    text-align: right;
    font-size: 13px; color: var(--ink-60);
    font-family: 'DM Mono', monospace; font-weight: 400;
  }
  .results-patient strong {
    display: block; color: var(--ink);
    font-size: 15px; margin-bottom: 4px; font-weight: 500;
  }

  /* Sort bar */
  .sort-bar {
    display: flex; gap: 4px; margin-bottom: 24px;
    align-items: center;
  }
  .sort-label {
    font-size: 12px; letter-spacing: 0.08em; color: var(--ink-60);
    font-family: 'DM Mono', monospace; font-weight: 500; margin-right: 8px;
  }
  .sort-btn {
    padding: 7px 14px; border: 1px solid var(--border);
    border-radius: 100px; background: transparent;
    font-size: 12px; font-family: 'DM Mono', monospace; font-weight: 500;
    color: var(--ink); cursor: pointer;
    transition: all 0.15s;
  }
  .sort-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* Product card */
  .card-list { display: flex; flex-direction: column; gap: 16px; }

  .product-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    transition: all 0.22s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .product-card::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: transparent;
    transition: background 0.22s;
  }
  .product-card:hover { border-color: rgba(181,150,90,0.4); box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
  .product-card:hover::before { background: var(--gold); }
  .product-card.rank-1::before { background: var(--gold); }
  .product-card.rank-2::before { background: var(--ink-30); }
  .product-card.rank-3::before { background: var(--ink-10); }

  .card-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; margin-bottom: 14px;
  }
  .card-name {
    font-size: 18px; font-weight: 700; line-height: 1.4;
    color: var(--ink); flex: 1;
  }
  .card-rank {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px; font-weight: 600;
    color: var(--ink-30); line-height: 1;
    flex-shrink: 0;
  }
  .rank-1 .card-rank { color: var(--gold); }

  .card-reg {
    font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em;
    color: var(--ink-60); font-weight: 500; margin-bottom: 14px;
  }

  .card-badges {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 16px;
  }
  .badge {
    padding: 4px 11px; border-radius: 100px;
    font-size: 12px; font-family: 'DM Mono', monospace;
    letter-spacing: 0.04em; font-weight: 500;
    border: 1px solid;
  }
  .badge-category { border-color: var(--ink-10); color: var(--ink-60); background: var(--ink-10); }
  .badge-protein { border-color: rgba(181,150,90,0.3); color: var(--gold); background: var(--gold-light); }
  .badge-lactose { border-color: rgba(80,160,100,0.3); color: #4a9460; background: rgba(80,160,100,0.08); }
  .badge-allergy { border-color: rgba(200,80,60,0.3); color: #c8503c; background: rgba(200,80,60,0.08); }

  .card-body { font-size: 14px; color: var(--ink-60); line-height: 1.75; margin-bottom: 16px; font-weight: 400; }

  .card-footer {
    display: flex; gap: 24px; flex-wrap: wrap;
    padding-top: 16px; border-top: 1px solid var(--border);
  }
  .card-stat {
    display: flex; flex-direction: column; gap: 3px;
  }
  .card-stat-label {
    font-size: 11px; font-family: 'DM Mono', monospace;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-60);
    font-weight: 500;
  }
  .card-stat-value { font-size: 14px; color: var(--ink); font-weight: 500; }

  /* Score bar */
  .score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .score-bar {
    flex: 1; height: 4px; background: var(--ink-10);
    border-radius: 100px; overflow: hidden;
  }
  .score-fill { height: 100%; background: var(--gold); border-radius: 100px; }
  .score-num {
    font-family: 'DM Mono', monospace; font-size: 13px;
    color: var(--ink); font-weight: 500; width: 36px; text-align: right;
    flex-shrink: 0;
  }
  .score-label { font-size: 12px; color: var(--ink); font-weight: 500; width: 50px; flex-shrink: 0; }

  /* Loading */
  .loading {
    display: flex; flex-direction: column; align-items: center;
    padding: 80px; gap: 20px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 1.5px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Notice */
  .notice {
    padding: 14px 16px;
    background: var(--gold-light);
    border: 1px solid rgba(181,150,90,0.25);
    border-radius: var(--radius-sm);
    font-size: 13px; color: var(--ink); font-weight: 400;
    display: flex; gap: 10px; align-items: flex-start;
    margin-bottom: 24px;
  }
  .notice svg { width: 15px; height: 15px; color: var(--gold); flex-shrink: 0; margin-top: 2px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(26,25,23,0.5);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--cream); border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    max-width: 640px; width: 100%;
    max-height: 80vh; overflow-y: auto;
    padding: 40px;
    transform: translateY(10px);
    transition: transform 0.25s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-close {
    position: sticky; top: 0; float: right;
    width: 32px; height: 32px;
    border: 1px solid var(--border); border-radius: 50%;
    background: var(--cream);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; color: var(--ink-60);
    transition: all 0.15s;
    z-index: 1;
  }
  .modal-close:hover { background: var(--warm); }
  .modal-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px; font-weight: 600;
    margin-bottom: 8px; margin-right: 40px; line-height: 1.25;
  }
  .modal-reg {
    font-family: 'DM Mono', monospace; font-size: 12px;
    color: var(--ink-60); font-weight: 500; margin-bottom: 24px; letter-spacing: 0.08em;
  }
  .modal-section { margin-bottom: 24px; }
  .modal-section-title {
    font-family: 'DM Mono', monospace; font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500;
    color: var(--gold); margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .modal-section-title::after {
    content: ''; flex: 1; height: 1px; background: rgba(181,150,90,0.2);
  }
  .modal-text { font-size: 15px; color: var(--ink); line-height: 1.85; font-weight: 400; }
  .modal-stats {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 16px;
    margin: 24px 0; padding: 20px; background: #fff;
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  .modal-stat-item { text-align: center; }
  .modal-stat-n {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px; font-weight: 600; color: var(--ink);
    line-height: 1;
  }
  .modal-stat-u { font-size: 12px; color: var(--ink-60); font-weight: 400; }
  .modal-stat-l {
    font-size: 11px; font-family: 'DM Mono', monospace; font-weight: 500;
    color: var(--ink-60); letter-spacing: 0.1em; text-transform: uppercase;
    margin-top: 5px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @media (max-width: 900px) {
    .site-header { padding: 0 24px; }
    .hero { padding: 48px 24px 40px; }
    .content-wrap { grid-template-columns: 1fr; }
    .form-panel { border-right: none; border-bottom: 1px solid var(--border); position: static; }
    .form-panel, .results-panel { padding: 32px 24px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--gold)">
        <path d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
      </svg>
    </div>
    特医食品推荐
  </div>
  <div class="header-meta">FSMP Intelligent Advisory · 182 Products</div>
</header>

<div class="page">
  <!-- HERO -->
  <div class="hero">
    <div class="hero-label">临床营养决策支持</div>
    <h1 class="hero-title">特殊医学用途<br>食品智能推荐</h1>
    <p class="hero-desc">基于 182 款已注册特医食品数据库，结合患者年龄段、症状及禁忌，精准筛选最适配方。</p>
  </div>

  <!-- CONTENT -->
  <div class="content-wrap">

    <!-- FORM PANEL -->
    <aside class="form-panel">
      <div class="section-title">患者信息输入</div>

      <div class="field-group">
        <div class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          年龄段
        </div>
        <div class="select-wrap">
          <select class="field-select" id="ageGroup">
            <option value="">请选择年龄段</option>
            <option value="infant">婴儿（0 ~ 12 月龄）</option>
            <option value="child_1_10">儿童（1 ~ 10 岁）</option>
            <option value="child_10_plus">儿童青少年（10 岁以上）</option>
            <option value="preterm">早产 / 低出生体重婴儿</option>
            <option value="adult_50plus">成人（50 岁以上）</option>
            <option value="adult">成人（18 岁以上）</option>
          </select>
        </div>
      </div>

      <div class="field-group">
        <div class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          症状 / 需求（可多选）
        </div>
        <div class="tags-grid" id="conditionTags">
          <button class="tag-btn" data-val="protein_allergy">蛋白质过敏</button>
          <button class="tag-btn" data-val="lactose_intolerant">乳糖不耐受</button>
          <button class="tag-btn" data-val="need_protein">补充蛋白质</button>
          <button class="tag-btn" data-val="poor_nutrition">营养不良</button>
          <button class="tag-btn" data-val="dehydration">脱水/腹泻</button>
          <button class="tag-btn" data-val="preop">术前补充</button>
          <button class="tag-btn" data-val="swallowing">吞咽障碍</button>
          <button class="tag-btn" data-val="tumor">肿瘤患者</button>
          <button class="tag-btn" data-val="pku">苯丙酮尿症</button>
        </div>
      </div>

      <div class="field-group">
        <div class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
          特殊说明（选填）
        </div>
        <input class="field-input" id="extraNote" type="text" placeholder="例：管饲喂养、高蛋白需求……">

// ── STATE ──────────────────────────────────────────────────────────────────────
let selectedConditions = new Set();
let currentResults = [];
let currentSortKey = 'score';

// ── TAGS ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tag-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = btn.dataset.val;
    if (selectedConditions.has(v)) {
      selectedConditions.delete(v);
      btn.classList.remove('active');
    } else {
      selectedConditions.add(v);
      btn.classList.add('active');
    }
  });
});

// ── PRESETS ───────────────────────────────────────────────────────────────────
function loadPreset(n) {
  // Reset
  selectedConditions.clear();
  document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('extraNote').value = '';

  if (n === 1) {
    document.getElementById('ageGroup').value = 'infant';
    ['protein_allergy'].forEach(v => {
      selectedConditions.add(v);
      document.querySelector(`.tag-btn[data-val="${v}"]`).classList.add('active');
    });
  } else if (n === 2) {
    document.getElementById('ageGroup').value = 'child_1_10';
    ['need_protein', 'lactose_intolerant'].forEach(v => {
      selectedConditions.add(v);
      document.querySelector(`.tag-btn[data-val="${v}"]`).classList.add('active');
    });
    document.getElementById('extraNote').value = '10岁儿童';
  }
  doRecommend();
}

// ── SCORING ENGINE ────────────────────────────────────────────────────────────
function scoreProduct(p, age, conditions, note) {
  let score = 0;
  const pop = (p.population || '').toLowerCase();
  const cat = (p.category || '').toLowerCase();
  const feat = (p.formula_feature || '').toLowerCase();
  const contra = (p.contraindications || '').toLowerCase();

  // Age matching
  if (age === 'infant') {
    if (pop.includes('婴儿') && !pop.includes('早产')) score += 40;
    else if (pop.includes('早产')) score -= 10;
    else score -= 30;
  } else if (age === 'preterm') {
    if (pop.includes('早产')) score += 40;
    else score -= 30;
  } else if (age === 'child_1_10') {
    if (pop.includes('1-10') || pop.includes('1～10') || pop.includes('1岁') || pop.includes('消化吸收不足造成营养不良的1')) score += 40;
    else if (pop.includes('10岁以上') || pop.includes('10岁以上')) score += 10;
    else if (pop.includes('婴儿')) score -= 30;
    else score += 5;
  } else if (age === 'child_10_plus') {
    if (pop.includes('10岁以上')) score += 40;
    else if (pop.includes('婴儿')) score -= 30;
    else score += 5;
  } else if (age === 'adult_50plus') {
    if (pop.includes('50岁以上')) score += 50;
    else if (pop.includes('10岁以上') || pop.includes('18岁以上')) score += 30;
    else if (pop.includes('婴儿')) score -= 30;
  } else if (age === 'adult') {
    if (pop.includes('18岁以上') || pop.includes('10岁以上')) score += 35;
    else if (pop.includes('婴儿')) score -= 30;
  }

  // Condition matching
  if (conditions.has('protein_allergy')) {
    if (cat.includes('氨基酸配方')) score += 35;
    else if (cat.includes('深度水解')) score += 30;
    else if (cat.includes('部分水解')) score += 20;
    else if (pop.includes('蛋白过敏') || pop.includes('食物蛋白')) score += 30;
    else if (feat.includes('水解') || feat.includes('过敏')) score += 15;
  }

  if (conditions.has('lactose_intolerant')) {
    if (p.lactose_free) score += 30;
    else score -= 15;
    if (cat.includes('无乳糖') || cat.includes('低乳糖')) score += 15;
    if (pop.includes('乳糖不耐受')) score += 15;
  }

  if (conditions.has('need_protein')) {
    if (cat.includes('蛋白质') || cat.includes('氨基酸')) score += 25;
    if (pop.includes('蛋白质')) score += 20;
    if (p.nut_protein_g > 5) score += 10;
    if (p.nut_protein_g > 8) score += 10;
  }

  if (conditions.has('poor_nutrition')) {
    if (cat.includes('全营养')) score += 25;
    if (pop.includes('营养') || feat.includes('全营养')) score += 15;
  }

  if (conditions.has('dehydration')) {
    if (cat.includes('电解质')) score += 35;
    if (pop.includes('脱水') || pop.includes('腹泻')) score += 20;
  }

  if (conditions.has('preop')) {
    if (pop.includes('术前')) score += 35;
    if (cat.includes('碳水化合物')) score += 20;
  }

  if (conditions.has('swallowing')) {
    if (pop.includes('吞咽')) score += 35;
    if (cat.includes('增稠')) score += 30;
  }

  if (conditions.has('tumor')) {
    if (pop.includes('肿瘤')) score += 40;
    if (cat.includes('特定全营养')) score += 20;
  }

  if (conditions.has('pku')) {
    if (pop.includes('苯丙酮') || cat.includes('氨基酸代谢')) score += 45;
  }

  // Note text matching
  if (note) {
    const n = note.toLowerCase();
    if (n.includes('管饲') && p.admin_route.includes('管饲')) score += 8;
    if (n.includes('婴儿') && pop.includes('婴儿')) score += 10;
    if (n.includes('蛋白') && (p.nut_protein_g > 3 || cat.includes('蛋白'))) score += 8;
  }

  // Penalty: contraindications conflict
  if (conditions.has('lactose_intolerant') && contra.includes('乳糖不耐')) score -= 25;
  if (conditions.has('protein_allergy') && contra.includes('乳蛋白过敏') && !cat.includes('水解') && !cat.includes('氨基酸')) score -= 20;

  return Math.max(0, score);
}

function getMatchReasons(p, age, conditions) {
  const reasons = [];
  const pop = p.population || '';
  const cat = p.category || '';

  if (age === 'infant' && pop.includes('婴儿')) reasons.push('适龄婴儿配方');
  if (age === 'child_1_10' && (pop.includes('1-10') || pop.includes('1～10'))) reasons.push('1-10岁儿童适用');
  if (age === 'child_10_plus' && pop.includes('10岁以上')) reasons.push('10岁以上适用');
  if (age === 'preterm' && pop.includes('早产')) reasons.push('早产儿专用');

  if (conditions.has('protein_allergy') && (cat.includes('氨基酸') || cat.includes('水解'))) reasons.push('适用蛋白过敏');
  if (conditions.has('lactose_intolerant') && p.lactose_free) reasons.push('无乳糖配方');
  if (conditions.has('need_protein') && (cat.includes('蛋白质') || p.nut_protein_g > 5)) reasons.push('高蛋白补充');
  if (conditions.has('tumor') && pop.includes('肿瘤')) reasons.push('肿瘤营养专用');
  if (conditions.has('pku') && (pop.includes('苯丙酮') || cat.includes('氨基酸代谢'))) reasons.push('PKU专用配方');

  return reasons;
}

// ── RECOMMEND ─────────────────────────────────────────────────────────────────
function doRecommend() {
  const age = document.getElementById('ageGroup').value;
  const note = document.getElementById('extraNote').value.trim();

  if (!age && selectedConditions.size === 0) {
    alert('请至少选择年龄段或症状。');
    return;
  }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('resultsContent').style.display = 'block';
  document.getElementById('resultsContent').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div style="font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-30);letter-spacing:0.1em">ANALYZING DATABASE</div>
    </div>`;

  setTimeout(() => {
    const scored = PRODUCTS.map(p => ({
      ...p,
      _score: scoreProduct(p, age, selectedConditions, note),
      _reasons: getMatchReasons(p, age, selectedConditions)
    })).filter(p => p._score > 0).sort((a, b) => b._score - a._score);

    currentResults = scored;
    renderResults(scored, age, note);
  }, 400);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
const AGE_LABELS = {
  infant: '婴儿（0～12 月龄）',
  preterm: '早产 / 低出生体重婴儿',
  child_1_10: '儿童（1～10 岁）',
  child_10_plus: '儿童青少年（10 岁以上）',
  adult_50plus: '成人（50 岁以上）',
  adult: '成人（18 岁以上）',
  '': '未指定年龄',
};
const COND_LABELS = {
  protein_allergy: '蛋白质过敏',
  lactose_intolerant: '乳糖不耐受',
  need_protein: '补充蛋白质',
  poor_nutrition: '营养不良',
  dehydration: '脱水/腹泻',
  preop: '术前补充',
  swallowing: '吞咽障碍',
  tumor: '肿瘤患者',
  pku: '苯丙酮尿症',
};

function renderResults(results, age, note) {
  const ageLabel = AGE_LABELS[age] || age;
  const condList = [...selectedConditions].map(c => COND_LABELS[c]).filter(Boolean).join('、');
  const maxScore = results[0]?._score || 1;

  let html = `
    <div class="results-header">
      <div>
        <div class="results-count">${results.length}
          <span>款匹配产品 · 共检索 ${PRODUCTS.length} 款</span>
        </div>
      </div>
      <div class="results-patient">
        <strong>${ageLabel}</strong>
        ${condList || '无特定症状'}
      </div>
    </div>

    <div class="notice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      本推荐结果仅供参考，实际使用须在医生或临床营养师指导下进行。
    </div>

    <div class="sort-bar">
      <span class="sort-label">排序</span>
      <button class="sort-btn ${currentSortKey==='score'?'active':''}" onclick="resortBy('score')">综合匹配</button>
      <button class="sort-btn ${currentSortKey==='protein'?'active':''}" onclick="resortBy('protein')">蛋白质含量</button>
      <button class="sort-btn ${currentSortKey==='energy'?'active':''}" onclick="resortBy('energy')">能量密度</button>
    </div>

    <div class="card-list">`;

  results.forEach((p, i) => {
    const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
    const pct = Math.round((p._score / maxScore) * 100);
    const proteinDisplay = p.nut_protein_g > 0 ? `${p.nut_protein_g}g/100mL` : '—';
    const energyDisplay = p.nut_energy_kJ > 0 ? `${p.nut_energy_kJ}kJ/100mL` : '—';

    let badges = `<span class="badge badge-category">${p.category}</span>`;
    if (p.lactose_free) badges += `<span class="badge badge-lactose">无乳糖</span>`;
    if (p._reasons.includes('适用蛋白过敏') || p.category.includes('氨基酸') || p.category.includes('水解'))
      badges += `<span class="badge badge-allergy">低致敏</span>`;
    if (p.nut_protein_g > 5) badges += `<span class="badge badge-protein">高蛋白</span>`;

    html += `
      <div class="product-card ${rankClass}" onclick="openModal(${i})">
        <div class="card-top">
          <div class="card-name">${p.product_name}${p.company ? ` <span style="color:var(--ink-60);font-size:13px">· ${p.company}</span>` : ''}</div>
          <div class="card-rank">${String(i+1).padStart(2,'0')}</div>
        </div>
        <div class="card-reg">${p.reg_no}</div>
        <div class="score-row">
          <span class="score-label">匹配度</span>
          <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
          <span class="score-num">${pct}%</span>
        </div>
        <div class="card-badges">${badges}</div>
        <div class="card-body">${p.formula_feature ? p.formula_feature.substring(0, 90) + (p.formula_feature.length > 90 ? '…' : '') : '—'}</div>
        <div class="card-footer">
          <div class="card-stat">
            <span class="card-stat-label">适用人群</span>
            <span class="card-stat-value" style="font-size:12px">${p.population.length > 20 ? p.population.substring(0,20)+'…' : p.population}</span>
          </div>
          <div class="card-stat">
            <span class="card-stat-label">蛋白质</span>
            <span class="card-stat-value">${proteinDisplay}</span>
          </div>
          <div class="card-stat">
            <span class="card-stat-label">给药途径</span>
            <span class="card-stat-value">${p.admin_route || '—'}</span>
          </div>
          <div class="card-stat">
            <span class="card-stat-label">规格</span>
            <span class="card-stat-value" style="font-size:12px">${p.net_weight ? (p.net_weight.length > 12 ? p.net_weight.substring(0,12)+'…' : p.net_weight) : '—'}</span>
          </div>
        </div>
      </div>`;
  });

  html += '</div>';
  document.getElementById('resultsContent').innerHTML = html;
}

function resortBy(key) {
  currentSortKey = key;
  let sorted;
  if (key === 'protein') {
    sorted = [...currentResults].sort((a,b) => b.nut_protein_g - a.nut_protein_g);
  } else if (key === 'energy') {
    sorted = [...currentResults].sort((a,b) => b.nut_energy_kJ - a.nut_energy_kJ);
  } else {
    sorted = [...currentResults];
  }
  const age = document.getElementById('ageGroup').value;
  renderResults(sorted, age, '');
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(idx) {
  const p = currentResults[idx];
  if (!p) return;

  const proteinDisplay = p.nut_protein_g > 0 ? p.nut_protein_g + ' g/100mL' : '—';
  const energyDisplay  = p.nut_energy_kJ > 0 ? p.nut_energy_kJ + ' kJ/100mL' : '—';

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-title">${p.product_name}</div>
    <div class="modal-reg">${p.reg_no}${p.company ? ' · ' + p.company : ''}</div>

    <div class="modal-stats">
      <div class="modal-stat-item">
        <div class="modal-stat-n">${proteinDisplay !== '—' ? p.nut_protein_g : '—'}</div>
        <div class="modal-stat-u">${proteinDisplay !== '—' ? 'g/100mL' : ''}</div>
        <div class="modal-stat-l">蛋白质</div>
      </div>
      <div class="modal-stat-item">
        <div class="modal-stat-n">${energyDisplay !== '—' ? p.nut_energy_kJ : '—'}</div>
        <div class="modal-stat-u">${energyDisplay !== '—' ? 'kJ/100mL' : ''}</div>
        <div class="modal-stat-l">能量</div>
      </div>
      <div class="modal-stat-item">
        <div class="modal-stat-n">${p.lactose_free ? '无' : '有'}</div>
        <div class="modal-stat-u"></div>
        <div class="modal-stat-l">乳糖</div>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">适用人群</div>
      <div class="modal-text">${p.population || '—'}</div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">配方特点</div>
      <div class="modal-text">${p.formula_feature || '—'}</div>
    </div>

    ${p.protein_source ? `
    <div class="modal-section">
      <div class="modal-section-title">蛋白质来源</div>
      <div class="modal-text">${p.protein_source}</div>
    </div>` : ''}

    ${p.special_additions ? `
    <div class="modal-section">
      <div class="modal-section-title">特殊添加成分</div>
      <div class="modal-text">${p.special_additions}</div>
    </div>` : ''}

    <div class="modal-section">
      <div class="modal-section-title">禁忌与注意事项</div>
      <div class="modal-text" style="color:#c8503c">${p.contraindications || '—'}</div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">规格 / 给药途径</div>
      <div class="modal-text">${p.net_weight || '—'} · ${p.admin_route || '—'}</div>
    </div>
  `;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay') && e.type !== 'click') return;
  if (e && e.currentTarget !== e.target && e.type === 'click' && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.querySelector('.modal-close').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
});
</script>
</body>
</html>
